global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mas-app'
    static_configs:
      - targets: ['app:8000']

  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama:11434']

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
