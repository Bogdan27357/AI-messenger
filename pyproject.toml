[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mas-ai-system"
version = "0.1.0"
description = "Multi-Agent AI System with local deployment (Ollama + Qdrant)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    # Core
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",

    # LLM & Vector DB
    "httpx>=0.27.0",
    "qdrant-client>=1.9.0",

    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",

    # Document processing
    "python-docx>=1.1.0",
    "PyPDF2>=3.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",

    # NLP
    "nltk>=3.8.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",

    # Integrations
    "exchangelib>=5.2.0",
    "aiosmtplib>=3.0.0",
    "aiohttp>=3.9.0",

    # Storage
    "minio>=7.2.0",

    # Monitoring & Logging
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",

    # Utils
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
